#  Per-kind file for image entries. Sibling of overthink.yml — included via
#  overthink.yml's `includes:` list. The schema kind discriminator is
#  `kind: image` for kind-keyed entries; root-shape map is `image:` (this file).
#  2026-05 kind-files cutover.
version: 2026.156.557
box:
    selkies-labwc:
        # CPU streaming desktop on the CachyOS (Arch) base — pixi build of selkies
        # (pixelflux Rust) + AUR google-chrome/wlrctl + labwc/waybar/swaync/etc.
        base: cachyos.cachyos
        builder:
            pixi: ov.arch-builder
            npm: ov.arch-builder
            cargo: ov.arch-builder
            aur: ov.arch-builder
        build:
            - pac
            - aur
        platform:
            - linux/amd64
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/selkies-desktop:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/dbus:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/ov:v2026.154.0740'
        port:
            - 3000:3000
            - 9222:9222
            - 9224:9224
            - 2222:2222
        eval:
            - command: test -x /usr/bin/labwc && test -x /usr/bin/google-chrome-stable && test -x /usr/local/bin/traefik && test -x /usr/sbin/sshd
              id: selkies-labwc-binaries
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:9224}
              id: selkies-labwc-chrome-devtools-mcp-port
              timeout: 5s
              scope: deploy
              reachable: true
    sway-browser-vnc:
        # Minimal Sway desktop + wayvnc (VNC) + Chrome (CDP) on the Fedora base.
        base: ov.fedora
        builder:
            pixi: ov.fedora-builder
            npm: ov.fedora-builder
            cargo: ov.fedora-builder
        platform:
            - linux/amd64
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/sway-desktop-vnc:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/dbus:v2026.154.0740'
            - '@github.com/overthinkos/overthink/candy/ov:v2026.154.0740'
        port:
            - 5900:5900
            - 9222:9222
            - 9224:9224
        eval:
            - command: test -x /usr/bin/sway && test -x /usr/bin/wayvnc && test -x /usr/bin/google-chrome-stable
              id: sway-browser-vnc-binaries
              exit_status: 0
            - command: supervisorctl status sway wayvnc | awk '{print $2}' | sort -u
              id: sway-browser-vnc-services
              scope: deploy
              in_container: true
              exit_status: 0
              stdout:
                - RUNNING
            - cdp: status
              id: sway-browser-vnc-cdp-up
              scope: deploy
              stdout:
                - contains: ok
            - vnc: status
              id: sway-browser-vnc-vnc-up
              scope: deploy
              stdout:
                - contains: ok
            - wl: toplevel
              id: sway-browser-vnc-wl-has-windows
              scope: deploy
            - dbus: list
              id: sway-browser-vnc-dbus-notifications-registered
              scope: deploy
              stdout:
                - contains: org.freedesktop.Notifications
            - vnc: screenshot
              id: sway-browser-vnc-vnc-framebuffer
              scope: deploy
              artifact: /tmp/sway-browser-vnc-fb.png
              artifact_min_bytes: 5000
