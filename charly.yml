#  overthinkos/selkies — the Selkies/Sway streaming-desktop image family, split
#  out of the main opencharly repo (2026-05). Mounted as a git submodule at
#  image/selkies.
#
#  SINGLE-FILE config: the two desktop images (selkies-labwc, sway-browser-vnc)
#  + their two disposable R10 beds are inlined here. This repo VENDORS NOTHING —
#  every layer is an `@github.com/...` ref into main (the desktop layers stay in
#  main: the selkies-desktop layer is shared with openclaw-desktop, and its
#  subtree is shared widely). The shared build-config arrives via a flat
#  `import:`; main's bases arrive via namespaced imports.
#
#  import: shapes —
#    * flat string  → build.yml (distro/builder/init vocabulary).
#    * charly:      → main (charly.fedora base + charly.fedora-builder / charly.arch-builder).
#    * cachyos: → the cachyos base (selkies-labwc is base: cachyos.cachyos).
#  Builder maps do NOT cross a namespace boundary, so each image declares its own.
#
#  PINS — every main ref (the desktop layers, build.yml, and the `charly` namespace)
#  pins v2026.159.1458; the `cachyos` namespace pins v2026.159.1455. All aligned
#  via `charly box reconcile`, so the resolver emits zero version warnings.
version: 2026.159.1912
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
import:
    - '@github.com/overthinkos/overthink/build.yml:v2026.160.0856'
    - charly: '@github.com/overthinkos/overthink:v2026.160.0856'
    - cachyos: '@github.com/overthinkos/cachyos:v2026.160.0856'
    - box.yml
    - pod.yml
    - k8s.yml
eval:
    # eval-sway-browser-vnc-pod deploys the SHIPPING sway-browser-vnc image
    # (Sway desktop + Chrome + wayvnc). The image bakes binaries/services/
    # cdp/vnc/wl/dbus + mcp (chrome-devtools-mcp layer); the eval: block adds
    # the remaining deploy-scope probes (operator-side http, cdp list, wl
    # sway-tree, record). Publishes the image's canonical 5900/9222/9224.
    eval-sway-browser-vnc-pod:
        target: pod
        box: sway-browser-vnc
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        eval:
            - http: "http://127.0.0.1:${HOST_PORT:9222}/json/version"
              id: esbv-pod-http-cdp
              scope: deploy
              status: 200
            - cdp: list
              id: esbv-pod-cdp-list
              scope: deploy
            - wl: sway-tree
              id: esbv-pod-wl-sway-tree
              scope: deploy
            - record: start
              id: esbv-pod-record-start
              scope: deploy
              record_name: eval-term
              record_mode: terminal
    # eval-selkies-labwc-pod deploys the CPU streaming desktop on the CachyOS
    # (Arch) base. Exercises the cachyos→arch-builder pixi build of selkies
    # (pixelflux Rust compile) AND the AUR build of google-chrome + wlrctl, plus
    # the labwc/waybar/swaync/pipewire/traefik/sshd layer stack. Ports are
    # remapped off the canonical 3000/9222/9224/2222 to avoid host clashes with a
    # running selkies-labwc or the other desktop beds. The deploy-scope probes
    # assert the AUR-built binaries actually landed on the running container; the
    # baked layer/image evals (incl. the Selkies HTTPS 200 UI probe) cover the
    # rest of the deploy surface.
    eval-selkies-labwc-pod:
        target: pod
        box: selkies-labwc
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: "R10 bed for the CPU selkies-labwc streaming desktop on the CachyOS (Arch) base — exercises the cachyos→arch-builder pixi build of selkies (pixelflux Rust compile) plus the AUR build of google-chrome + wlrctl and the labwc/waybar/swaync/pipewire/traefik/sshd layer stack."
            tag: [testing]
        eval:
            - {id: eslc-pod-chrome-aur, scope: deploy, file: /usr/bin/google-chrome-stable, exists: true}
            - {id: eslc-pod-wlrctl-aur, scope: deploy, file: /usr/bin/wlrctl, exists: true}
            - {id: eslc-pod-wtype, scope: deploy, file: /usr/bin/wtype, exists: true}
            - {id: eslc-pod-labwc, scope: deploy, file: /usr/bin/labwc, exists: true}
            - {id: eslc-pod-swaync, scope: deploy, file: /usr/bin/swaync, exists: true}
            - {id: eslc-pod-pipewire, scope: deploy, file: /usr/bin/pipewire, exists: true,}
            # labwc liveness is asserted generically by the labwc layer's
            # labwc-stable eval (supervisord uptime >=20s) — baked into every
            # labwc image, so the bed inherits it (no bed-specific duplicate, R3).
            # CPU-RENDER PROOF (the "rendering without any GPU works" gate): this
            # bed is GPU-less (selkies-labwc composes no nvidia/rocm layer → no
            # /dev/dri), and the selkies layer's baked selkies-frame-not-black
            # (real non-uniform pixels reach the stream) + selkies-encoder-active
            # (no GPU render node → the CPU x264 path is legitimate) run here
            # automatically — no per-bed duplicate (R3). This is the pure-CPU leg
            # of the AMD-VAAPI / NVIDIA-NVENC / CPU-x264 encode matrix.
