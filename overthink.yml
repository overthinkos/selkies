#  overthinkos/selkies — the Selkies/Sway streaming-desktop image family, split
#  out of the main overthink repo (2026-05). Mounted as a git submodule at
#  image/selkies.
#
#  SINGLE-FILE config: the three desktop images (selkies-desktop,
#  selkies-desktop-nvidia, sway-browser-vnc) + their two disposable R10 beds are
#  inlined here. This repo VENDORS NOTHING — every layer is an `@github.com/...`
#  ref into main (the desktop layers stay in main: selkies-desktop is shared with
#  openclaw-desktop, and its subtree is shared widely). The shared build-config
#  arrives via a flat `import:`; main's bases arrive via namespaced imports.
#
#  import: shapes —
#    * flat string  → build.yml (distro/builder/init vocabulary).
#    * ov:      → main (ov.fedora base + ov.fedora-builder / ov.arch-builder).
#    * cachyos: → the cachyos base (selkies-desktop is base: cachyos.cachyos).
#    * nvidia:  → the GPU base (selkies-desktop-nvidia is base: nvidia.nvidia).
#  Builder maps do NOT cross a namespace boundary, so each image declares its own.
#
#  PINS — agent-forwarding + ov + build.yml pin the ecosystem tag v2026.141.1600
#  (standalone top-level layers, NOT pulled transitively by the desktop metalayers,
#  so they stay on the ecosystem baseline ov-cachyos/nvidia/fedora also pin). The
#  selkies desktop metalayers AND dbus pin v2026.144.0531: selkies-desktop (chrome
#  CDP/MCP probe readiness fix, the selkies `layers: [ffmpeg]` pixelflux runtime-lib
#  fix, + the pixelflux/labwc auto-detection eval tests) and sway-desktop-vnc
#  (chrome CDP/MCP readiness fix) both transitively require dbus at their own tag,
#  so the explicit dbus pin is v2026.144.0531 to match (pinning it at v2026.141.1600
#  collides with the swaync/a11y-tools `require: dbus`).
#  The `ov`/`cachyos` namespaces pin v2026.143.844; `nvidia` pins v2026.143.1840.
#
#  ACCEPTED RESOLVER WARNINGS (2): the desktop metalayers pull `pixi` (via python)
#  and `nodejs` (via chrome-devtools-mcp) transitively at v2026.144.0531, while the
#  shared arch/fedora builders pin them at the ecosystem baseline v2026.141.1600. The
#  warn-and-newest-wins resolver warns once per layer and uses the newest (0531) —
#  correct, designed behavior. Driving these to zero would need an ecosystem-wide
#  pixi/nodejs baseline bump across main + every distro submodule (blocked by the
#  mutual main<->cachyos/nvidia import); this family rides the newest desktop stack
#  and accepts the two newest-wins notices.
version: 2026.143.844
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
import:
    - '@github.com/overthinkos/overthink/build.yml:v2026.141.1600'
    - ov: '@github.com/overthinkos/overthink:v2026.143.844'
    - cachyos: '@github.com/overthinkos/cachyos:v2026.143.844'
    - nvidia: '@github.com/overthinkos/nvidia:v2026.143.1840'
image:
    selkies-desktop:
        # CPU streaming desktop on the CachyOS (Arch) base — pixi build of selkies
        # (pixelflux Rust) + AUR google-chrome/wlrctl + labwc/waybar/swaync/etc.
        base: cachyos.cachyos
        builder:
            pixi: ov.arch-builder
            npm: ov.arch-builder
            cargo: ov.arch-builder
            aur: ov.arch-builder
        build:
            - pac
            - aur
        platform:
            - linux/amd64
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/selkies-desktop:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/dbus:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/ov:v2026.141.1600'
        port:
            - 3000:3000
            - 9222:9222
            - 9224:9224
            - 2222:2222
        eval:
            - command: test -x /usr/bin/labwc && test -x /usr/bin/google-chrome-stable && test -x /usr/local/bin/traefik && test -x /usr/sbin/sshd
              id: selkies-desktop-binaries
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:9224}
              id: selkies-desktop-chrome-devtools-mcp-port
              timeout: 5s
              scope: deploy
              reachable: true
    selkies-desktop-nvidia:
        # GPU variant on the Fedora nvidia base (NVENC H.264). Disabled/untested.
        enabled: false
        base: nvidia.nvidia
        builder:
            pixi: ov.fedora-builder
            npm: ov.fedora-builder
            cargo: ov.fedora-builder
        platform:
            - linux/amd64
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/selkies-desktop:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/dbus:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/ov:v2026.141.1600'
        port:
            - 3000:3000
            - 9222:9222
            - 9224:9224
            - 2222:2222
    sway-browser-vnc:
        # Minimal Sway desktop + wayvnc (VNC) + Chrome (CDP) on the Fedora base.
        base: ov.fedora
        builder:
            pixi: ov.fedora-builder
            npm: ov.fedora-builder
            cargo: ov.fedora-builder
        platform:
            - linux/amd64
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/sway-desktop-vnc:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/dbus:v2026.144.0531'
            - '@github.com/overthinkos/overthink/layers/ov:v2026.141.1600'
        port:
            - 5900:5900
            - 9222:9222
            - 9224:9224
        eval:
            - command: test -x /usr/bin/sway && test -x /usr/bin/wayvnc && test -x /usr/bin/google-chrome-stable
              id: sway-browser-vnc-binaries
              exit_status: 0
            - command: supervisorctl status sway wayvnc | awk '{print $2}' | sort -u
              id: sway-browser-vnc-services
              scope: deploy
              in_container: true
              exit_status: 0
              stdout:
                - RUNNING
            - cdp: status
              id: sway-browser-vnc-cdp-up
              scope: deploy
              stdout:
                - contains: ok
            - vnc: status
              id: sway-browser-vnc-vnc-up
              scope: deploy
              stdout:
                - contains: ok
            - wl: toplevel
              id: sway-browser-vnc-wl-has-windows
              scope: deploy
            - dbus: list
              id: sway-browser-vnc-dbus-notifications-registered
              scope: deploy
              stdout:
                - contains: org.freedesktop.Notifications
            - vnc: screenshot
              id: sway-browser-vnc-vnc-framebuffer
              scope: deploy
              artifact: /tmp/sway-browser-vnc-fb.png
              artifact_min_bytes: 5000
eval:
    # eval-sway-browser-vnc-pod deploys the SHIPPING sway-browser-vnc image
    # (Sway desktop + Chrome + wayvnc). The image bakes binaries/services/
    # cdp/vnc/wl/dbus + mcp (chrome-devtools-mcp layer); the eval: block adds
    # the remaining deploy-scope probes (operator-side http, cdp list, wl
    # sway-tree, record). Publishes the image's canonical 5900/9222/9224.
    eval-sway-browser-vnc-pod:
        target: pod
        image: sway-browser-vnc
        disposable: true
        lifecycle: dev
        eval:
            - http: "http://127.0.0.1:${HOST_PORT:9222}/json/version"
              id: esbv-pod-http-cdp
              scope: deploy
              status: 200
            - cdp: list
              id: esbv-pod-cdp-list
              scope: deploy
            - wl: sway-tree
              id: esbv-pod-wl-sway-tree
              scope: deploy
            - record: start
              id: esbv-pod-record-start
              scope: deploy
              record_name: eval-term
              record_mode: terminal
    # eval-selkies-desktop-pod deploys the CPU streaming desktop on the CachyOS
    # (Arch) base. Exercises the cachyos→arch-builder pixi build of selkies
    # (pixelflux Rust compile) AND the AUR build of google-chrome + wlrctl, plus
    # the labwc/waybar/swaync/pipewire/traefik/sshd layer stack. Ports are
    # remapped off the canonical 3000/9222/9224/2222 to avoid host clashes with a
    # running selkies-desktop or the other desktop beds. The deploy-scope probes
    # assert the AUR-built binaries actually landed on the running container; the
    # baked layer/image evals (incl. the Selkies HTTPS 200 UI probe) cover the
    # rest of the deploy surface.
    eval-selkies-desktop-pod:
        target: pod
        image: selkies-desktop
        disposable: true
        lifecycle: dev
        port:
            - 33000:3000
            - 39222:9222
            - 39224:9224
            - 32222:2222
        description:
            feature: "R10 bed for the CPU selkies-desktop streaming desktop on the CachyOS (Arch) base — exercises the cachyos→arch-builder pixi build of selkies (pixelflux Rust compile) plus the AUR build of google-chrome + wlrctl and the labwc/waybar/swaync/pipewire/traefik/sshd layer stack."
            tag: [testing]
        eval:
            - {id: esd-pod-chrome-aur, scope: deploy, file: /usr/bin/google-chrome-stable, exists: true}
            - {id: esd-pod-wlrctl-aur, scope: deploy, file: /usr/bin/wlrctl, exists: true}
            - {id: esd-pod-wtype, scope: deploy, file: /usr/bin/wtype, exists: true}
            - {id: esd-pod-labwc, scope: deploy, file: /usr/bin/labwc, exists: true}
            - {id: esd-pod-swaync, scope: deploy, file: /usr/bin/swaync, exists: true}
            - {id: esd-pod-pipewire, scope: deploy, file: /usr/bin/pipewire, exists: true}
